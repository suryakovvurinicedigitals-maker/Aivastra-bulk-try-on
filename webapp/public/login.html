<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Vastra — Sign in</title>
<link rel="icon" type="image/png" href="/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card-wrapper">
      <div class="login-card">
        <div class="brand login-brand">
          <img class="brand-logo" src="/logo.png" alt="AI Vastra Logo" />
          <div class="brand-text">
            <div class="brand-name">AI Vastra</div>
          </div>
        </div>

        <div class="login-header">
          <h1>Sign in</h1>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label for="login-username">Username</label>
            <input type="text" id="login-username" name="username" autocomplete="username" placeholder="Enter username" required autofocus />
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="••••••••••••" required />
          </div>

          <div class="status err" id="login-status"></div>

          <button type="submit" class="btn-primary login-submit" id="login-submit-btn">Sign in</button>
        </form>
      </div>
    </div>
  </div>

  <script src="/login.js"></script>
</body>
</html>
